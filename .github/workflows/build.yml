name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install deps & build
        run: npm install && npm install -D typescript && npm run build
      - name: Setup Android
        run: |
          npx cap init "Tuto-Cardiogramme" "com.tutocardiogramme.app" --web-dir dist
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Tuto-Cardiogramme.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
